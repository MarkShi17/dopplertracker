[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dopplertracker"
version = "0.1.0"
description = "Aircraft acoustic geolocation with retarded-time physics and multi-event refinement"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pillow>=10"]

[project.scripts]
dopplertrack = "dopplertracker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

